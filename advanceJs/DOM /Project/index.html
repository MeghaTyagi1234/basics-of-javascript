<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p>height in cm:-<input type="text" id="height"></p>
            <p>wight in kg:-<input type="text" id="weight"></p>
            <button id="button">Calculate</button>
            <div id="result"> </div>
            <div id="weight-guide">
                <h3>BMI weight guide</h3>
                <h4>Underweight: BMI less than 18.5</h4>
                <h4>Normal weight: BMI 18.5-24.9</h4>
                <h4>Overweight: BMI 25-29.9</h4>
                <h4>Obesity: BMI 30 or more</h4>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>

</html>
